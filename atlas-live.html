<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS — Live Agent Monitor</title>
<style>
:root{
  --bg:#07090d; --panel:#0d1119; --panel2:#121826; --line:rgba(255,255,255,.07);
  --ink:#e8eef6; --ink-dim:rgba(232,238,246,.55); --ink-faint:rgba(232,238,246,.28);
  --long:#00d68f; --short:#ff4d6d; --live:#00d68f; --shadow:#ffb454; --wait:#5b6472;
  --profit:#00d68f; --loss:#ff4d6d; --accent:#4db8ff;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --disp:'Bebas Neue',Impact,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ── AGENT STATUS BAR (signature element) ── */
.statusbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0a0e15,#07090d);border-bottom:1px solid var(--line);padding:14px 0}
.statusbar .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .logo{font-family:var(--disp);font-size:30px;letter-spacing:2px;line-height:1}
.brand .logo .a{color:var(--accent)}
.brand .tag{font-size:9px;letter-spacing:3px;color:var(--ink-faint);text-transform:uppercase}
.mode-chip{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:1px}
.mode-chip .dot{width:8px;height:8px;border-radius:50%}
.mode-live{background:rgba(0,214,143,.12);color:var(--live);border:1px solid rgba(0,214,143,.35)}
.mode-live .dot{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
.mode-shadow{background:rgba(255,180,84,.1);color:var(--shadow);border:1px solid rgba(255,180,84,.3)}
.mode-shadow .dot{background:var(--shadow)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.slots{margin-left:auto;display:flex;align-items:center;gap:16px}
.slot-item{text-align:right}
.slot-item .n{font-size:20px;font-weight:700;line-height:1}
.slot-item .l{font-size:8px;letter-spacing:1.5px;color:var(--ink-faint);text-transform:uppercase;margin-top:2px}

/* ── MANUAL RISK BANNER ── */
.risk-banner{background:rgba(255,77,109,.09);border:1px solid rgba(255,77,109,.4);border-radius:8px;padding:12px 16px;margin:18px 0;display:none;align-items:center;gap:12px}
.risk-banner.show{display:flex}
.risk-banner .ico{font-size:18px}
.risk-banner .txt{font-size:12px;color:#ffb4c2}
.risk-banner .txt b{color:var(--loss)}

/* ── SUMMARY ── */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px}
.stat .v{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat .l{font-size:9px;letter-spacing:1.5px;color:var(--ink-faint);text-transform:uppercase;margin-top:6px}
.stat.accent .v{color:var(--accent)}
.v.pos{color:var(--profit)}.v.neg{color:var(--loss)}

/* ── SECTION HEADS ── */
.shead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.shead h2{font-family:var(--disp);font-size:22px;letter-spacing:1.5px;font-weight:400}
.shead .rule{flex:1;height:1px;background:var(--line)}
.shead .cnt{font-size:10px;color:var(--ink-faint);letter-spacing:1px}

/* ── TRADE CARDS ── */
.trades{display:flex;flex-direction:column;gap:8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-left:3px solid var(--wait)}
.tcard.long{border-left-color:var(--long)}
.tcard.short{border-left-color:var(--short)}
.tcard.is-shadow{opacity:.72;border-left-style:dashed}
.tc-sym{display:flex;flex-direction:column;gap:3px;min-width:96px}
.tc-sym .s{font-size:16px;font-weight:700;letter-spacing:.5px}
.tc-sym .dir{font-size:10px;font-weight:700;letter-spacing:1px}
.dir.long{color:var(--long)}.dir.short{color:var(--short)}
.tc-mid{display:flex;gap:20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px}
.field .k{font-size:8px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
.field .v{font-size:13px;font-weight:500}
.tc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px}
.b-live{background:rgba(0,214,143,.14);color:var(--live)}
.b-shadow{background:rgba(255,180,84,.12);color:var(--shadow)}
.b-open{background:rgba(77,184,255,.12);color:var(--accent)}
.b-closed{background:rgba(255,255,255,.06);color:var(--ink-dim)}
.pnl{font-size:15px;font-weight:700}
.pnl.pos{color:var(--profit)}.pnl.neg{color:var(--loss)}
.manual-flag{font-size:9px;color:var(--loss);letter-spacing:.5px;font-weight:700}

.empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.empty .big{font-family:var(--disp);font-size:26px;letter-spacing:1px;color:var(--ink-dim);margin-bottom:8px}
.foot{text-align:center;padding:30px 0;color:var(--ink-faint);font-size:10px;letter-spacing:1px}
.refresh-note{font-size:9px;color:var(--ink-faint);letter-spacing:1px}
@media(max-width:640px){
  .tcard{grid-template-columns:1fr;gap:10px}
  .tc-right{align-items:flex-start;flex-direction:row;justify-content:space-between;width:100%}
  .slots{width:100%;margin-left:0;justify-content:space-between}
}
</style>
</head>
<body>
<div class="statusbar">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><span class="a">A</span>TLAS</div>
      <div class="tag">Live Agent Monitor</div>
    </div>
    <div id="modeChip" class="mode-chip mode-shadow"><span class="dot"></span><span id="modeText">LOADING</span></div>
    <div class="slots">
      <div class="slot-item"><div class="n" id="slotToday">&mdash;</div><div class="l">Trades Today</div></div>
      <div class="slot-item"><div class="n" id="slotCap">/3</div><div class="l">Daily Cap</div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="riskBanner" class="risk-banner">
    <span class="ico">&#9888;</span>
    <span class="txt"><b>MANUAL RISK REQUIRED</b> &mdash; <span id="riskCount">0</span> open live position(s) have no stop-loss set by ATLAS. You must place SL/target manually.</span>
  </div>

  <div class="summary" id="summary"></div>

  <div class="shead"><h2>Today</h2><div class="rule"></div><span class="cnt" id="todayCnt"></span></div>
  <div class="trades" id="todayTrades"></div>

  <div class="shead"><h2>History</h2><div class="rule"></div><span class="cnt" id="histCnt"></span></div>
  <div class="trades" id="histTrades"></div>

  <div class="foot">
    <span class="refresh-note">Auto-refreshes every 30s &middot; Last update <span id="lastUpd">&mdash;</span></span>
  </div>
</div>

<script>
var SB='https://eibdlcanpudjgmkjxrga.supabase.co';
var AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpYmRsY2FucHVkamdta2p4cmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzUxODMsImV4cCI6MjA5NDExMTE4M30.KmdMatjh1l8I-c80h71W7g0elATIBCwefa5gFU7t29A';
var HDR={apikey:AK,Authorization:'Bearer '+AK};

function istToday(){var n=new Date(Date.now()+(5.5*3600*1000));return n.toISOString().split('T')[0];}
function fmt(n){var v=parseFloat(n);return isNaN(v)?'\u2014':v.toLocaleString('en-IN',{maximumFractionDigits:2});}
function money(n){var v=parseFloat(n)||0;return (v>=0?'+':'')+'\u20b9'+Math.round(v).toLocaleString('en-IN');}

function isLive(t){return (t.agent_mode||'').toUpperCase()==='LIVE';}
function isShadow(t){return (t.agent_mode||'').toUpperCase()==='SHADOW';}
function isOpen(t){return (t.status||'').toUpperCase()==='OPEN';}

async function fetchTrades(){
  var r=await fetch(SB+'/rest/v1/atlas_trades?order=entry_date.desc,created_at.desc&limit=200',{headers:HDR});
  if(!r.ok)return [];
  return await r.json();
}

function tradeCard(t){
  var dir=(t.direction||'').toUpperCase();
  var live=isLive(t), open=isOpen(t);
  var notional=(parseFloat(t.entry_price)||0)*(parseFloat(t.qty)||0);
  var cls='tcard '+(dir==='LONG'?'long':'short')+(live?'':' is-shadow');
  var modeBadge=live?'<span class="badge b-live">LIVE</span>':'<span class="badge b-shadow">SHADOW</span>';
  var statusBadge=open?'<span class="badge b-open">OPEN</span>':'<span class="badge b-closed">'+(t.status||'\u2014')+'</span>';
  var pnlHtml='';
  if(t.pnl!=null && parseFloat(t.pnl)!==0){
    var p=parseFloat(t.pnl);
    pnlHtml='<div class="pnl '+(p>=0?'pos':'neg')+'">'+money(p)+'</div>';
  }
  var manualFlag=(live&&open)?'<div class="manual-flag">&#9888; SET SL MANUALLY</div>':'';
  return '<div class="'+cls+'">'
    +'<div class="tc-sym"><div class="s">'+t.symbol+'</div><div class="dir '+(dir==='LONG'?'long':'short')+'">'+(dir==='LONG'?'\u2191':'\u2193')+' '+dir+'</div></div>'
    +'<div class="tc-mid">'
      +'<div class="field"><div class="k">Entry</div><div class="v">\u20b9'+fmt(t.entry_price)+'</div></div>'
      +'<div class="field"><div class="k">Qty</div><div class="v">'+(t.qty||'\u2014')+'</div></div>'
      +'<div class="field"><div class="k">Notional</div><div class="v">\u20b9'+Math.round(notional).toLocaleString('en-IN')+'</div></div>'
      +'<div class="field"><div class="k">Session</div><div class="v">'+(t.session||'\u2014')+'</div></div>'
      +'<div class="field"><div class="k">Setup</div><div class="v">'+(t.setup_name||'\u2014')+'</div></div>'
    +'</div>'
    +'<div class="tc-right">'+modeBadge+statusBadge+pnlHtml+manualFlag+'</div>'
    +'</div>';
}

function renderSummary(trades){
  var today=istToday();
  var todayT=trades.filter(function(t){return t.entry_date===today;});
  var liveT=trades.filter(isLive);
  var openLive=trades.filter(function(t){return isLive(t)&&isOpen(t);});
  var closed=trades.filter(function(t){return t.pnl!=null&&parseFloat(t.pnl)!==0;});
  var netPnl=closed.reduce(function(s,t){return s+(parseFloat(t.pnl)||0);},0);
  var wins=closed.filter(function(t){return parseFloat(t.pnl)>0;}).length;
  var wr=closed.length?Math.round(wins/closed.length*100):0;

  // status bar
  var anyLiveToday=todayT.some(isLive);
  var chip=document.getElementById('modeChip'), txt=document.getElementById('modeText');
  if(anyLiveToday){chip.className='mode-chip mode-live';txt.textContent='LIVE TRADING';}
  else if(todayT.length){chip.className='mode-chip mode-shadow';txt.textContent='SHADOW MODE';}
  else{chip.className='mode-chip mode-shadow';txt.textContent='IDLE / WAITING';}
  document.getElementById('slotToday').textContent=todayT.length;
  document.getElementById('slotCap').textContent='/3';

  // risk banner
  var rb=document.getElementById('riskBanner');
  if(openLive.length){rb.classList.add('show');document.getElementById('riskCount').textContent=openLive.length;}
  else rb.classList.remove('show');

  var stats=[
    {v:todayT.length,l:'Trades Today',cls:'accent'},
    {v:openLive.length,l:'Open Live'},
    {v:liveT.length,l:'Total Live'},
    {v:trades.filter(isShadow).length,l:'Total Shadow'},
    {v:money(netPnl),l:'Net P&L (closed)',cls:netPnl>=0?'pos':'neg',raw:true},
    {v:wr+'%',l:'Win Rate ('+wins+'/'+closed.length+')'}
  ];
  document.getElementById('summary').innerHTML=stats.map(function(s){
    var vcls=s.raw?('v '+(s.cls||'')):'v';
    var extra=(!s.raw&&s.cls==='accent')?' accent':'';
    return '<div class="stat'+extra+'"><div class="'+vcls+'">'+s.v+'</div><div class="l">'+s.l+'</div></div>';
  }).join('');
}

function render(trades){
  renderSummary(trades);
  var today=istToday();
  var todayT=trades.filter(function(t){return t.entry_date===today;});
  var histT=trades.filter(function(t){return t.entry_date!==today;});

  document.getElementById('todayCnt').textContent=todayT.length+' trade(s)';
  document.getElementById('histCnt').textContent=histT.length+' trade(s)';

  var tt=document.getElementById('todayTrades');
  tt.innerHTML=todayT.length?todayT.map(tradeCard).join('')
    :'<div class="empty"><div class="big">No trades yet today</div>ATLAS is waiting for the market to declare direction, or no setup has qualified.</div>';

  var ht=document.getElementById('histTrades');
  ht.innerHTML=histT.length?histT.map(tradeCard).join(''):'<div class="empty">No history yet.</div>';

  var n=new Date();
  document.getElementById('lastUpd').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function load(){
  try{var t=await fetchTrades();render(t);}
  catch(e){document.getElementById('todayTrades').innerHTML='<div class="empty">Could not load trades. '+e.message+'</div>';}
}
load();
setInterval(load,30000);
</script>
</body>
</html>
