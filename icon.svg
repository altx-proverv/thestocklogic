<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1018"/>
      <stop offset="100%" stop-color="#06080a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="100%" stop-color="#00d68f"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4db8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d68f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="12" y="12" width="488" height="488" rx="72" fill="none" stroke="url(#border-grad)" stroke-width="3"/>
  <!-- Corner accents -->
  <path d="M40 80 L40 40 L80 40" fill="none" stroke="#4db8ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M432 40 L472 40 L472 80" fill="none" stroke="#00d68f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M40 432 L40 472 L80 472" fill="none" stroke="#00d68f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M432 472 L472 472 L472 432" fill="none" stroke="#4db8ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- TSL text -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" fill="url(#text-grad)" letter-spacing="-4">TSL</text>
  <!-- Subtitle -->
  <text x="256" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="36" fill="#4db8ff" letter-spacing="8" opacity="0.6">SIGNAL</text>
  <!-- Bottom line -->
  <line x1="120" y1="390" x2="392" y2="390" stroke="url(#border-grad)" stroke-width="1.5"/>
</svg>